<script>
(()=>{
  'use strict';
  const F='https://tibia.fandom.com';
  const API='https://api.tibiadata.com/v4';
  const CACHE='tibiaLootInfoV66';
  const TTL=172800000;
  const nf=new Intl.NumberFormat('pl-PL');
  // ---- Dane lokalne (generowane skryptem scripts/build_data.py): najpierw data/*.json, dopiero potem API.
  const DATA='data/';
  const LOCAL={ok:false,meta:null,boosted:'',races:new Map(),loot:null,lootP:null,items:null,itemsP:null};
  const lp=u=>u?(/^https?:\/\//i.test(u)?u:DATA+u):'';
  async function localJson(f){const r=await fetch(DATA+f,{cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status+' '+f);return r.json()}
  function localStamp(){const g=LOCAL.meta?.generated;return g?String(g).slice(0,10):''}
  async function loadLocalCatalog(){
    try{
      const [meta,cat]=await Promise.all([localJson('meta.json').catch(()=>null),localJson('creatures.json')]);
      const list=Array.isArray(cat?.list)?cat.list:[];
      if(list.length<20)throw new Error('za krótki katalog');
      creatureMeta.clear();LOCAL.races.clear();
      for(const x of list){if(!x||!x.n||!x.r)continue;creatureMeta.set(x.n,{race:x.r,imageUrl:lp(x.i),plural:x.p||''});LOCAL.races.set(x.n,x.r)}
      LOCAL.meta=meta||{};LOCAL.boosted=cat.boosted||'';LOCAL.ok=true;
      rebuildCreatureCatalog();
      diag['dane lokalne (data/)']={ok:true,err:''};renderDiag();
      setStatus('Baza: '+creatureCatalog.length+' mobów'+(localStamp()?' • stan z '+localStamp():''),'ok');
      if(document.activeElement?.id==='mobSearch')showCreatureSuggestions(document.getElementById('mobSearch').value);
      setTimeout(()=>{loadLocalLoot().catch(()=>{});loadLocalItems()},250);
      return true;
    }catch(e){
      diag['dane lokalne (data/)']={ok:false,err:String(e?.message||e)};renderDiag();
      return false;
    }

  async function showPrice(name){const out=document.getElementById('priceResult');if(!name){out.innerHTML='<div class="modernEmpty">Wpisz nazwę itemu.</div>';return}out.innerHTML='<div class="modernEmpty">Sprawdzam NPC i ceny…</div>';name=await canonItem(name);lastPrice=name;
    if(isCreatureName(name)){out.innerHTML='<div class="modernEmpty"><b>'+esc(name)+'</b> to potwór, nie item.<br><button class="primary" id="addAsMob" style="margin-top:12px">Dodaj do listy mobów</button></div>';document.getElementById('addAsMob').onclick=()=>{document.querySelector('[data-mode=loot]').click();addMob(name)};return}
    rememberPrice(name);const was=state.items.get(name)?._full,job=getItem(name);let d;try{const cur=state.items.get(name);d=cur&&cur.sellers.length?cur:await job}catch{d={name,sellPrice:null,sellers:[]}}if(!was)job.then(()=>{if(lastPrice===name)showPrice(name)});const sellers=(d?.sellers||[]).filter(s=>s.name).sort((a,b)=>(a.price??Infinity)-(b.price??Infinity)),market=num(document.getElementById('marketPrice').value),npc=d?.sellPrice??(sellers[0]?.price??null),diff=market!==null&&npc!==null?market-npc:null,pct=market!==null&&npc?((market/npc)-1)*100:null;const compare=diff===null?'':('<div class="priceCompare '+(diff>0?'good':diff<0?'bad':'warn')+'"><b>'+(diff>0?'Market jest wyżej niż NPC o ':diff<0?'NPC płaci więcej niż Market o ':'Market = NPC')+(diff?' '+nf.format(Math.abs(diff))+' gp':'')+'</b>'+(pct!==null?' <span class="muted">('+((pct>=0?'+':'')+pct.toFixed(1))+'%)</span>':'')+'</div>');out.innerHTML='<div class="priceHero"><div class="priceBox"><div class="label">NPC kupi od Ciebie</div><div class="value">'+(npc==null?'Brak danych':nf.format(npc)+' gp')+'</div></div><div class="priceBox"><div class="label">Twój Market</div><div class="value">'+(market==null?'—':nf.format(market)+' gp')+'</div></div></div>'+compare+'<div class="itemPriceTitle">'+imgTag('item',d.name||name,'itemSprite')+'<b>'+esc(d.name||name)+'</b></div><div class="sectionTitle">NPC / ceny'+(sellers.length?' • '+sellers.length+' NPC':'')+'</div><div class="sellerList">'+(sellers.length?sellers.map(s=>'<div class="sellerRow"><span><a href="'+(s.url||npcUrl(s.name))+'" target="_blank" rel="noopener noreferrer">'+esc(s.name)+'</a><span class="sellerCity">'+esc(s.city||'miasto nieznane')+'</span></span><b>'+(s.price==null?'—':nf.format(s.price)+' gp')+'</b></div>').join(''):'<div class="modernEmpty">Brak danych o NPC kupujących.</div>')+'</div>'}

    if(!cEl||!bEl)return;
    const card=(el,kind,name,img)=>{el.classList.toggle('off',!name);el.innerHTML=(img?'<img alt="" src="'+esc(img)+'" onerror="this.remove()">':'')+'<div style="min-width:0"><div class="bk">'+kind+'</div><div class="bn">'+esc(name||'brak danych')+'</div></div>'};
    try{
      const d=await apiJson(API+'/creatures',15000);const b=d?.creatures?.boosted;
      if(b?.name){const nm=singularize(String(b.name).trim(),String(b.race||'').trim())||String(b.name).trim();card(cEl,'Boosted creature dziś',nm,validImg(b.image_url)?b.image_url:'');cEl.disabled=false;cEl.title='Kliknij, aby dodać do listy mobów';cEl.onclick=()=>{addMob(nm)}}

  // ---- Sprzedaż lootu: log z Hunt Analyzera -> najlepszy NPC dla każdego itemu, pogrupowane po NPC
  const SELL={rows:[]};
  function parseLoot(txt){
    const L=txt.split(/\r?\n/),i=L.findIndex(l=>/looted items/i.test(l)),src=i>=0?L.slice(i+1):L,m=new Map();
    for(const l of src){const r=l.match(/^\s*(\d[\d,.]*)\s*x\s+(.+?)\s*$/i);if(r){const n=r[2].toLowerCase(),q=parseInt(r[1].replace(/[,.]/g,''))||0;m.set(n,(m.get(n)||0)+q)}else if(i>=0&&l.trim()&&!/^\s/.test(l))break}
    return m}
  async function sellCalc(){
    const out=document.getElementById('sellResult'),m=parseLoot(document.getElementById('sellInput').value);
    if(!m.size){out.innerHTML='<div class="modernEmpty">Nie znalazłem itemów. Wklej log z Hunt Analyzera (sekcja „Looted Items”) albo listę w formacie „3x item”.</div>';return}
    const names=[...m.keys()].filter(n=>!/(^|\s)coins?$/.test(n));
    out.innerHTML='<div class="modernEmpty">Sprawdzam NPC dla '+names.length+' itemów…</div>';
    const res=[];let k=0;
    await Promise.all(Array.from({length:6},async()=>{while(k<names.length){const raw=names[k++];let c=await canonItem(raw);if(c===raw){const t=raw.replace(/^(an?|the)\s+/,'');if(t!==raw)c=await canonItem(t)}let d;try{d=await getItem(c)}catch{d={sellers:[]}}res.push({name:c,q:m.get(raw),d})}}));
    SELL.rows=res;drawSell()}
  function drawSell(){
    const out=document.getElementById('sellResult');if(!SELL.rows.length)return;const city=document.getElementById('sellCity').value,G=new Map(),none=[];let total=0,cnt=0;
    for(const r of SELL.rows){const f=(r.d.sellers||[]).filter(s=>s.price!=null&&(!city||s.city===city));if(!f.length){none.push(r);continue}
      const b=f.reduce((a,x)=>x.price>a.price?x:a),key=b.name+'|'+(b.city||'');if(!G.has(key))G.set(key,{name:b.name,city:b.city,sum:0,rows:[]});
      const g=G.get(key),v=b.price*r.q;g.sum+=v;g.rows.push({r,price:b.price,v});total+=v;cnt++}
    const groups=[...G.values()].sort((a,b)=>b.sum-a.sum),row='display:flex;justify-content:space-between;gap:10px;padding:3px 0';
    out.innerHTML='<div class="partySummary"><div class="partyStat"><div class="n">'+nf.format(total)+' gp</div><div class="l">łącznie u NPC</div></div><div class="partyStat"><div class="n">'+groups.length+'</div><div class="l">NPC do odwiedzenia</div></div><div class="partyStat"><div class="n">'+cnt+'</div><div class="l">itemów sprzedanych</div></div></div>'+
      groups.map(g=>'<div class="transferGroup"><div class="transferFrom">'+esc(g.name)+(g.city?' ('+esc(g.city)+')':'')+' <span>— razem '+nf.format(g.sum)+' gp</span></div>'+g.rows.sort((a,b)=>b.v-a.v).map(x=>'<div style="'+row+'"><span>'+x.r.q+'× <a href="'+wiki(x.r.name)+'" target="_blank" rel="noopener noreferrer">'+esc(x.r.name)+'</a></span><span>'+nf.format(x.price)+' gp/szt • '+nf.format(x.v)+' gp</span></div>').join('')+'</div>').join('')+
      (none.length?'<div class="status warn">Bez kupca'+(city?' w tym mieście':'')+' (market albo zostaw): '+none.map(r=>r.q+'× '+esc(r.name)).join(', ')+'</div>':'')+
      '<div class="subtleLine" style="margin-top:8px">Dla każdego itemu wybrany jest NPC z najwyższą ceną. Coiny pominięte. Ceny z marketu mogą być wyższe — sprawdź w zakładce „Sprawdź cenę”.</div>'}
  document.getElementById('sellCity').innerHTML=document.getElementById('lootCity').innerHTML;

  function tibiaDayIndex(){
    // czas ścienny w Europie Środkowej -> minus 10 h (server save) -> dzień tygodnia 0=niedziela
    const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));

  }
